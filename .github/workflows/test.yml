name: Test

# Typecheck + vitest for em-tracker-bridge.
#
# Neither `em` nor a live tracker is installed/reachable here. `em` is a
# separate, independently-versioned package this bridge only shells out to;
# tests that shell out to it gate on hasEm() and skip in CI (see README.md).
# The Linear adapter is tested entirely against a mocked HTTP layer -- no
# LINEAR_API_KEY secret is configured for this workflow, and none is needed.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run
